apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finops-cost-detective
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/myorg/ai-cloud-cost-detective.git'
    targetRevision: HEAD
    path: chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: finops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
