name: AWS EKS CI/CD Enterprise Production Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/aws/**'
      - 'terraform/aws/**'
      - '.github/workflows/ci-cd-aws.yml'
      - 'deploy-aws.sh'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  ################################################################################
  # 1. Compile & Code Validation (Parallel)
  ################################################################################
  compile-validation:
    name: ⚡ Compile & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Compile Backend & UI_Script Python Syntax
        run: |
          python -m py_compile ./application/backend/main.py
          python -m py_compile ./application/UI_Script/server.py
      - name: Compile & Validate Frontend React TypeScript Code
        run: |
          cd application/frontend
          npm ci
          npm run build

  ################################################################################
  # 2. Gitleaks Secret Scan (Parallel)
  ################################################################################
  gitleaks-scan:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  ################################################################################
  # 3. Trivy Filesystem Vulnerability Scan (Parallel)
  ################################################################################
  trivy-fs-scan:
    name: 🛡️ Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 4. Backend Docker Build & Push (Parallel)
  ################################################################################
  backend-build:
    name: 🐳 Backend Docker Build & Push (AWS ECR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build & Push Backend Docker Image
        run: |
          IMAGE_TAG="${{ steps.login-ecr.outputs.registry }}/finops-backend:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f ./application/backend/Dockerfile .
          docker push $IMAGE_TAG
      - name: Run Trivy Image Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/finops-backend:${{ github.sha }}"
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 5. Frontend Docker Build & Push (Parallel)
  ################################################################################
  frontend-build:
    name: 📱 Frontend Docker Build & Push (AWS ECR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build & Push Frontend Docker Image
        run: |
          IMAGE_TAG="${{ steps.login-ecr.outputs.registry }}/finops-frontend:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f ./application/frontend/Dockerfile .
          docker push $IMAGE_TAG
      - name: Run Trivy Image Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/finops-frontend:${{ github.sha }}"
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 6. UI_Script Provisioner Docker Build & Push (Parallel)
  ################################################################################
  ui-script-build:
    name: 🚀 UI_Script Provisioner Docker Build & Push (AWS ECR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build & Push UI_Script Provisioner Docker Image
        run: |
          IMAGE_TAG="${{ steps.login-ecr.outputs.registry }}/finops-ui-script:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f ./application/UI_Script/Dockerfile .
          docker push $IMAGE_TAG
      - name: Run Trivy Image Vulnerability Scan (UI_Script)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/finops-ui-script:${{ github.sha }}"
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 7. GitOps CD Update Job (Runs after parallel builds finish)
  ################################################################################
  gitops-cd:
    name: ⛵ GitOps CD Helm Update (AWS)
    needs: [compile-validation, gitleaks-scan, trivy-fs-scan, backend-build, frontend-build, ui-script-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: GitOps CD Update (Bump Helm Chart Image Tags)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sed -i 's/backendTag:.*/backendTag: "${{ github.sha }}"/' chart/values.yaml
          sed -i 's/frontendTag:.*/frontendTag: "${{ github.sha }}"/' chart/values.yaml
          sed -i 's/uiScriptTag:.*/uiScriptTag: "${{ github.sha }}"/' chart/values.yaml
          git add chart/values.yaml
          git commit -m "AWS GitOps CD: Bump image tags to ${{ github.sha }} [skip ci]" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true
