name: Azure AKS CI/CD Enterprise Production Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'application/**'
      - 'chart/**'
      - 'script_to_create_Az/**'
      - '.github/workflows/ci-cd-azure.yml'
  workflow_dispatch:

jobs:
  pipeline:
    name: Enterprise DevSecOps CI/CD Pipeline (Azure AKS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      ################################################################################
      # Compile & Code Validation
      ################################################################################
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Compile Backend & UI_Script Python Syntax
        run: |
          python -m py_compile ./application/backend/main.py
          python -m py_compile ./application/UI_Script/server.py

      - name: Compile & Validate Frontend React TypeScript Code
        run: |
          cd application/frontend
          npm ci
          npm run build

      ################################################################################
      # Gitleaks Secret Scanning
      ################################################################################
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      ################################################################################
      # Trivy Filesystem Scan
      ################################################################################
      - name: Run Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      ################################################################################
      # Azure Authentication & Docker Configuration
      ################################################################################
      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      ################################################################################
      # Backend Docker Build
      ################################################################################
      - name: Backend Docker Build & Push (Azure ACR)
        run: |
          IMAGE_TAG="${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f ./application/backend/Dockerfile .
          docker push $IMAGE_TAG

      ################################################################################
      # Frontend Docker Build
      ################################################################################
      - name: Frontend Docker Build & Push (Azure ACR)
        run: |
          IMAGE_TAG="${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f ./application/frontend/Dockerfile .
          docker push $IMAGE_TAG

      ################################################################################
      # UI_Script Provisioner Docker Build
      ################################################################################
      - name: UI_Script Provisioner Docker Build & Push (Azure ACR)
        run: |
          IMAGE_TAG="${{ secrets.ACR_LOGIN_SERVER }}/ui_script:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f ./application/UI_Script/Dockerfile .
          docker push $IMAGE_TAG

      ################################################################################
      # Trivy Image Scan
      ################################################################################
      - name: Run Trivy Image Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}"
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy Image Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}"
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy Image Vulnerability Scan (UI_Script)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.ACR_LOGIN_SERVER }}/ui_script:${{ github.sha }}"
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      ################################################################################
      # GitOps CD Update
      ################################################################################
      - name: GitOps CD Update (Bump Helm Chart Image Tags)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sed -i 's/backendTag:.*/backendTag: "${{ github.sha }}"/' chart/values.yaml
          sed -i 's/frontendTag:.*/frontendTag: "${{ github.sha }}"/' chart/values.yaml
          sed -i 's/uiScriptTag:.*/uiScriptTag: "${{ github.sha }}"/' chart/values.yaml
          git add chart/values.yaml
          git commit -m "Azure GitOps CD: Bump image tags to ${{ github.sha }} [skip ci]" || true
          git push || true
