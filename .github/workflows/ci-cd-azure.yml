name: Azure AKS CI/CD Enterprise Production Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/azure/**'
      - 'terraform/azure/**'
      - 'chart/**'
      - 'application/**'
      - '.github/workflows/ci-cd-azure.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  ################################################################################
  # 1. Compile & Code Validation (Parallel)
  ################################################################################
  compile-validation:
    name: ⚡ Compile & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Compile Backend & UI_Script Python Syntax
        run: |
          python -m py_compile ./application/backend/main.py
          python -m py_compile ./application/UI_Script/server.py
      - name: Compile & Validate Frontend React TypeScript Code
        run: |
          cd application/frontend
          npm ci
          npm run build

  ################################################################################
  # 2. Gitleaks Secret Scan (Parallel)
  ################################################################################
  gitleaks-scan:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  ################################################################################
  # 3. Trivy Filesystem Vulnerability Scan (Parallel)
  ################################################################################
  trivy-fs-scan:
    name: 🛡️ Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 4. Backend Docker Build & Push (Parallel)
  ################################################################################
  backend-build:
    name: 🐳 Backend Docker Build & Push (Azure ACR / GHCR)
    runs-on: ubuntu-latest
    env:
      ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry (ACR)
        if: ${{ env.ACR_SERVER != '' }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR Fallback)
        if: ${{ env.ACR_SERVER == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        run: |
          if [ -n "$ACR_SERVER" ]; then
            IMAGE_TAG="${ACR_SERVER}/backend:${{ github.sha }}"
          else
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="ghcr.io/${REPO_OWNER}/backend:${{ github.sha }}"
          fi
          echo "Target Image Tag: ${IMAGE_TAG}"
          echo "TARGET_IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          docker build -t $IMAGE_TAG -f ./application/backend/Dockerfile .
          docker push $IMAGE_TAG

      - name: Run Trivy Image Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TARGET_IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 5. Frontend Docker Build & Push (Parallel)
  ################################################################################
  frontend-build:
    name: 📱 Frontend Docker Build & Push (Azure ACR / GHCR)
    runs-on: ubuntu-latest
    env:
      ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry (ACR)
        if: ${{ env.ACR_SERVER != '' }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR Fallback)
        if: ${{ env.ACR_SERVER == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Docker Image
        run: |
          if [ -n "$ACR_SERVER" ]; then
            IMAGE_TAG="${ACR_SERVER}/frontend:${{ github.sha }}"
          else
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="ghcr.io/${REPO_OWNER}/frontend:${{ github.sha }}"
          fi
          echo "Target Image Tag: ${IMAGE_TAG}"
          echo "TARGET_IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          docker build -t $IMAGE_TAG -f ./application/frontend/Dockerfile .
          docker push $IMAGE_TAG

      - name: Run Trivy Image Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TARGET_IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 6. UI_Script Provisioner Docker Build & Push (Parallel)
  ################################################################################
  ui-script-build:
    name: 🚀 UI_Script Provisioner Docker Build & Push (Azure ACR / GHCR)
    runs-on: ubuntu-latest
    env:
      ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry (ACR)
        if: ${{ env.ACR_SERVER != '' }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR Fallback)
        if: ${{ env.ACR_SERVER == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push UI_Script Provisioner Docker Image
        run: |
          if [ -n "$ACR_SERVER" ]; then
            IMAGE_TAG="${ACR_SERVER}/ui_script:${{ github.sha }}"
          else
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="ghcr.io/${REPO_OWNER}/ui_script:${{ github.sha }}"
          fi
          echo "Target Image Tag: ${IMAGE_TAG}"
          echo "TARGET_IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          docker build -t $IMAGE_TAG -f ./application/UI_Script/Dockerfile .
          docker push $IMAGE_TAG

      - name: Run Trivy Image Vulnerability Scan (UI_Script)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TARGET_IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  ################################################################################
  # 7. GitOps CD Update Job (Runs after parallel builds finish)
  ################################################################################
  gitops-cd:
    name: ⛵ GitOps CD Helm Update (Azure)
    needs: [compile-validation, gitleaks-scan, trivy-fs-scan, backend-build, frontend-build, ui-script-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: GitOps CD Update (Bump Helm Chart Image Tags)
        run: |
          echo "Updating Helm chart values with latest Docker image tags..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sed -i 's/backendTag:.*/backendTag: "${{ github.sha }}"/' chart/values.yaml
          sed -i 's/frontendTag:.*/frontendTag: "${{ github.sha }}"/' chart/values.yaml
          sed -i 's/uiScriptTag:.*/uiScriptTag: "${{ github.sha }}"/' chart/values.yaml
          git add chart/values.yaml
          git commit -m "Azure GitOps CD: Bump image tags to ${{ github.sha }} [skip ci]" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true

