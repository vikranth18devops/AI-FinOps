replicaCount: 3

image:
  repository: myregistry.azurecr.io/finops
  pullPolicy: IfNotPresent
  frontendTag: "8dcf75d9281e08704b1290de5ffe51287c12501a"
  backendTag: "8dcf75d9281e08704b1290de5ffe51287c12501a"
  uiScriptTag: "8dcf75d9281e08704b1290de5ffe51287c12501a"

service:
  frontendPort: 80
  backendPort: 8000
  uiScriptPort: 8500

# In-Cluster Kubernetes PostgreSQL StatefulSet Configuration
postgres:
  enabled: true
  user: "finopsadmin"
  password: "SecretPass123!"
  database: "cloud_cost_db"
  storageSize: "10Gi"

resources:
  frontend:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  backend:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  uiScript:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# HorizontalPodAutoscaler (HPA v2) Configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

env:
  # In-cluster Kubernetes PostgreSQL connection string
  DATABASE_URL: "postgresql://finopsadmin:SecretPass123!@postgres-service.finops.svc.cluster.local:5432/cloud_cost_db"
  JWT_SECRET: "super_secure_jwt_secret_key_2026"
