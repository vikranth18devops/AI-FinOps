apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finops-ingress
  namespace: finops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finops-backend-service
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: finops-backend-service
                port:
                  number: 8000
          - path: /studio
            pathType: Prefix
            backend:
              service:
                name: finops-ui-script-service
                port:
                  number: 8585
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finops-frontend-service
                port:
                  number: 80
